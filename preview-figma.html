<style>
  /* ══════════════════════════════════════════════════════════════════════
     TOKENS DE COLOR (espejo de src/theme/colors.js)
     ══════════════════════════════════════════════════════════════════════ */
  :root {
    --bg:                #F4F4F7;  /* neutral.light.background */
    --surface:           #FFFFFF;  /* neutral.light.surface */
    --surface-2:         #f5f5f5;  /* neutral.light.scale.50 */
    --bg-inverse:        #222226;  /* neutral.light.backgroundInverse */
    --border:            #bfbfbf;  /* neutral.light.border */
    --border-secondary:  #b0cfef;  /* brand.borderSecondary (200) */
    --text:              #1a1a1a;  /* neutral.light.text.primary */
    --text-muted:        #5a5c61;  /* neutral.light.text.secondary */
    --text-inverse:      #eef4fb;  /* neutral.light.text.inverse (info-50) */
    --primary:           #003366;  /* brand.DEFAULT */
    --primary-hover:     #265e95;  /* brand.hover (500) */
    --primary-active:    #00488f;  /* brand.active */
    --primary-border:    #004d99;  /* brand.border */
    --primary-soft:      #b0cfef;  /* brand.textResaltado */
    --primary-100:       #d7e7f8;
    --primary-50:        #edf5fc;
    --success:           #388b3c;  /* status.success.500 */
    --success-soft:      #edf7ee;  /* status.success.50 */
    --warning:           #ebb83d;  /* status.warning.500 */
    --warning-soft:      #fff8e7;
    --danger:            #c53b3b;  /* status.danger.500 */
    --danger-soft:       #fdeeee;
    --info:              #2769ab;  /* status.info.500 */
    --info-soft:         #eef4fb;
    --overlay:           color-mix(in srgb, #F4F4F7 98%, transparent); /* ui.overlay.light */
    --formfield:         color-mix(in srgb, #F4F4F7 75%, transparent); /* ui.formField.light */
  }
  .dark {
    --bg:                #121212;  /* neutral.dark.background */
    --surface:           #222226;  /* neutral.dark.surface */
    --surface-2:         #181818;  /* neutral.dark.scale.50 */
    --bg-inverse:        #F4F4F7;  /* neutral.dark.backgroundInverse */
    --border:            #323238;  /* neutral.dark.border */
    --border-secondary:  #b0cfef;  /* brand.borderSecondary (constante) */
    --text:              #ffffff;  /* neutral.dark.text.primary */
    --text-muted:        #b3b3b7;  /* neutral.dark.text.secondary */
    --text-inverse:      #003f80;  /* neutral.dark.text.inverse (info-600) */
    --overlay:           color-mix(in srgb, #222226 98%, transparent); /* ui.overlay.dark */
    --formfield:         color-mix(in srgb, #222226 75%, transparent); /* ui.formField.dark */
    --success-soft:      #103012; --warning-soft:#33280e; --danger-soft:#430d0d; --info-soft:#001933;
    --primary-100:       #00264d; --primary-50: #00172f;
  }

  body { font-family: "Inter", system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  /* ══════════ Chrome estilo Figma ══════════ */
  .figma-topbar  { background:#2C2C2C; }
  .figma-panel   { background:#1E1E1E; }
  .figma-label   { color:#9E9E9E; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
  .figma-text    { color:#CCCCCC; }
  .figma-chip    { background:#2C2C2C; border:1px solid #3D3D3D; color:#BDBDBD; }
  .figma-chip.active { background:#0A84FF; border-color:#0A84FF; color:#fff; }
  .figma-switch:hover { background:#3D3D3D; }

  /* Lienzo con grid de puntos */
  .canvas-grid {
    background-color:#191919;
    background-image: radial-gradient(circle, #333 1px, transparent 1px);
    background-size: 20px 20px;
  }

  /* Marco de dispositivo */
  .device-frame {
    transition: width .35s ease, height .35s ease, border-radius .35s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px #3D3D3D;
  }
  .device-frame.desktop { width:1100px; height:720px; border-radius:12px; }
  .device-frame.mobile  { width:375px;  height:780px; border-radius:44px; }
  .frame-scroll { overflow-y:auto; height:100%; }
  .frame-scroll::-webkit-scrollbar { width:8px; height:8px; }
  .frame-scroll::-webkit-scrollbar-thumb { background:rgba(128,128,128,.4); border-radius:4px; }
  .device-notch { display:none; }
  .device-frame.mobile .device-notch { display:flex; }

  .swatch { border:1px solid rgba(0,0,0,.12); }
  .dark .swatch { border-color:rgba(255,255,255,.12); }
  .token-row:hover { background:rgba(255,255,255,.04); }

  .seg-base    { background:var(--bg); }
  .seg-surface { background:var(--surface); }
  .seg-focus   { background:var(--primary); }
  .bar-track   { background:rgba(255,255,255,.08); }

  /* Scrollbar de paneles */
  .panel-scroll::-webkit-scrollbar { width:8px; }
  .panel-scroll::-webkit-scrollbar-thumb { background:#3D3D3D; border-radius:4px; }
</style>

<script>

          "primary-border": "var(--primary-border)",
          "primary-soft": "var(--primary-soft)",

          success: "var(--success)",
          "success-soft": "var(--success-soft)",

          sans: ["Inter", "system-ui", "sans-serif"],
          mono: ["JetBrains Mono", "ui-monospace", "monospace"],
        },
      },
    },
  };
</script>

/* ══════════════════════════════════════════════════════════════════════
   HELPERS: contraste WCAG (luminancia relativa)
   ══════════════════════════════════════════════════════════════════════ */
function hexToRgb(hex) {
  hex = (hex || "").replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  const n = parseInt(hex, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function lum(hex) {
  const { r, g, b } = hexToRgb(hex);
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function contrast(a, b) {
  const l1 = lum(a), l2 = lum(b);
  const [hi, lo] = l1 > l2 ? [l1, l2] : [l2, l1];
  return (hi + 0.05) / (lo + 0.05);
}
function wcagBadge(ratio) {
  const pass = ratio >= 4.5;
  return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${pass ? 'bg-[#1f5a22] text-[#d7ecd9]' : 'bg-[#651414] text-[#f5aaaa]'}">${pass ? 'AA ✓' : 'FAIL'}</span>`;
}

/* ══════════════════════════════════════════════════════════════════════
   FUNCIONES PRINCIPALES
   ══════════════════════════════════════════════════════════════════════ */
let activeTheme = "light";
let activeDevice = "desktop";
let activeModule = "portal-residente";

function setTheme(mode) {
  activeTheme = mode;
  document.documentElement.classList.toggle("dark", mode === "dark");
  ["th-light", "th-dark"].forEach(id => document.getElementById(id).classList.remove("active"));
  document.getElementById("th-" + mode).classList.add("active");
  renderTokens();
  renderWcag();
}

function setDevice(device) {
  activeDevice = device;
  const frame = document.getElementById("device-frame");
  frame.classList.toggle("desktop", device === "desktop");
  frame.classList.toggle("mobile", device === "mobile");
  const bc = document.getElementById("browser-chrome");
  bc.classList.toggle("hidden", device !== "desktop");
  ["dev-desktop", "dev-mobile"].forEach(id => document.getElementById(id).classList.remove("active"));
  document.getElementById("dev-" + device).classList.add("active");
}

function setModule(key) {
  activeModule = key;
  renderModule();
  renderCode();
  renderProportions();
}

/* ═══════════════ Render Módulo activo ═══════════════ */
function renderModule() {
  const mod = MODULES[activeModule];
  document.getElementById("module-render").innerHTML = mod.html;
  // reset scroll del frame
  document.querySelector(".frame-scroll").scrollTop = 0;
  document.getElementById("module-code-label").textContent = mod.kind;
  document.querySelectorAll("#module-list button").forEach(b => {
    b.classList.toggle("active", b.dataset.module === activeModule);
  });
}

/* ═══════════════ Render lista de módulos ═══════════════ */
function renderModules() {
  const list = document.getElementById("module-list");
  list.innerHTML = Object.entries(MODULES).map(([key, m]) => `
    <button data-module="${key}" onclick="setModule('${key}')"
      class="flex items-center gap-2 w-full px-2 py-1.5 rounded-md text-left text-[12px] transition-colors"
      style="color:#BDBDBD;">
      <i class="fa-solid ${m.icon} w-4 text-center text-[11px]" style="color:#9E9E9E;"></i>
      <span>${m.label}</span>
    </button>`).join("");
  document.querySelectorAll("#module-list button").forEach(b => {
    b.classList.add("hover:bg-white/5");
  });
}

/* ═══════════════ Render Inspector de tokens (izquierda) ═══════════════ */
function swatch(hex) {
  return `<span class="swatch inline-block w-4 h-4 rounded-sm shrink-0" style="background:${hex};"></span>`;
}
function tokenRow(name, hex, extra) {
  return `
    <div class="token-row flex items-center gap-2 px-1.5 py-1 rounded-md">
      ${swatch(hex)}
      <span class="mono text-[10px] flex-1 truncate" style="color:#BDBDBD;">${name}</span>
      <span class="mono text-[10px] uppercase" style="color:#7C7C7C;">${hex}</span>
    </div>`;
}
function tokenGroup(title, rows) {
  return `
    <div>
      <p class="figma-label mb-1">${title}</p>
      <div class="flex flex-col gap-0.5">${rows.join("")}</div>
    </div>`;
}
function renderTokens() {
  const isDark = activeTheme === "dark";
  const nl = PALETTE.neutral[isDark ? "dark" : "light"];
  const insp = document.getElementById("token-inspector");
  insp.innerHTML = [
    tokenGroup("brand · primary", [
      tokenRow("primary / DEFAULT", PALETTE.brand.DEFAULT, "primario"),
      tokenRow("hover · 500", PALETTE.brand.hover, "hover"),
      tokenRow("active", PALETTE.brand.active, "activo"),
      tokenRow("border", PALETTE.brand.border),
      tokenRow("borderSecondary · 200", PALETTE.brand.borderSecondary),
    ]),
    tokenGroup("neutral · " + (isDark ? "dark" : "light"), [
      tokenRow("background", nl.background),
      tokenRow("surface", nl.surface),
      tokenRow("border", nl.border),
      tokenRow("text.primary", nl.text.primary),
      tokenRow("text.secondary", nl.text.secondary),
    ]),
    tokenGroup("status · semantic", [
      tokenRow("success · 500", PALETTE.status.success.DEFAULT),
      tokenRow("warning · 500", PALETTE.status.warning.DEFAULT),
      tokenRow("danger · 500", PALETTE.status.danger.DEFAULT),
      tokenRow("info · 500", PALETTE.status.info.DEFAULT),
    ]),
    tokenGroup("ui · componentes", [
      tokenRow("datepickerAccent", PALETTE.ui.datepickerAccent),
      tokenRow("checkedOnBrand", PALETTE.ui.checkedOnBrand),
      tokenRow("overlay.light", isDark ? PALETTE.ui.overlayDark : PALETTE.ui.overlayLight),
    ]),
  ].join("");
}

/* ═══════════════ Render Inspector de código (derecha) ═══════════════ */
function renderCode() {
  const mod = MODULES[activeModule];
  const box = document.getElementById("code-inspector");
  box.innerHTML = mod.classes.map((c, i) => `
    <div class="flex items-start gap-2">
      <span class="text-[#3D3D3D] select-none w-4 text-right">${String(i + 1).padStart(2, "0")}</span>
      <span class="text-[#7fb1e5]">.</span><span class="text-[#7fb1e5]">${c}</span>
    </div>`).join("");
}

/* ═══════════════ Render Regla 60/20/5 ═══════════════ */
function renderProportions() {
  const box = document.getElementById("proportions");
  const bar = `
    <div class="flex h-6 w-full overflow-hidden rounded-md bar-track">
      <div class="seg-base h-full" style="width:60%;"></div>
      <div class="seg-surface h-full" style="width:20%;"></div>
      <div class="seg-focus h-full" style="width:5%;"></div>
    </div>`;
  const legend = `
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm seg-base border"></span><span class="text-[11px] flex-1" style="color:#BDBDBD;">Base · 60%</span><span class="mono text-[10px]" style="color:#7C7C7C;">fondo + texto</span></div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm seg-surface border"></span><span class="text-[11px] flex-1" style="color:#BDBDBD;">Superficie · 20%</span><span class="mono text-[10px]" style="color:#7C7C7C;">cards / paneles</span></div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm seg-focus border"></span><span class="text-[11px] flex-1" style="color:#BDBDBD;">Foco · 5%</span><span class="mono text-[10px]" style="color:#7C7C7C;">marca / CTA</span></div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style="background:var(--warning);"></span><span class="text-[11px] flex-1" style="color:#BDBDBD;">Acento · 15%</span><span class="mono text-[10px]" style="color:#7C7C7C;">semánticos / hover</span></div>
    </div>`;
  box.innerHTML = bar + legend;
}

/* ═══════════════ Render WCAG AA ═══════════════ */
function renderWcag() {
  const isDark = activeTheme === "dark";
  const nl = PALETTE.neutral[isDark ? "dark" : "light"];
  const txtP = nl.text.primary, txtS = nl.text.secondary, bg = nl.background, surface = nl.surface, brand = PALETTE.brand.DEFAULT;

  const pairs = [
    ["text.primary / background", txtP, bg],
    ["text.secondary / background", txtS, bg],
    ["text.primary / surface", txtP, surface],
    ["brand on surface", brand, surface],
    ["onBrand on brand", PALETTE.brand.onBrand, brand],
  ];
  document.getElementById("wcag-panel").innerHTML = pairs.map(([label, fg, bgc]) => {
    const ratio = contrast(fg, bgc);
    return `
      <div class="flex items-center gap-2 px-2 py-1 rounded-md" style="background:#2C2C2C;">
        ${swatch(bgc)}<span class="mono text-[10px] flex-1 truncate" style="color:#BDBDBD;">${label}</span>
        <span class="mono text-[10px]" style="color:#7C7C7C;">${ratio.toFixed(2)}:1</span>
        ${wcagBadge(ratio)}
      </div>`;
  }).join("");

  // Score global en topbar: todas pasan → AA
  const allPass = pairs.every(([ , fg, bgc]) => contrast(fg, bgc) >= 4.5);
  const el = document.getElementById("wcag-score");
  el.textContent = allPass ? "AA" : "A-";
  el.style.color = allPass ? "#4caf50" : "#e45555";
}

/* ═══════════════ Init ═══════════════ */
renderModules();
renderModule();
renderCode();
renderProportions();
renderTokens();
renderWcag();
setTheme("light");
setDevice("desktop");
</script>
</body>
</html>
