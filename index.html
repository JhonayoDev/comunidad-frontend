<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Briku — Administración de Condominios</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#173a6a" />

    <!-- Discriminador de boot: corre antes que el bundle JS. Si el usuario
         reporta pantalla blanca y este marcador existe pero no hay hito
         `boot:main`, el bundle de JS nunca cargó (SW/shell/red). -->
    <script>
      try {
        localStorage.setItem("briku:html-loaded", String(Date.now()));
      } catch (e) {}
    </script>

    <!-- iOS (Safari no lee el manifest aún) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- ============================================================
         SPLASH SCREEN (Briku)
         ESTE BLOQUE DEBE SER ESTÁTICO Y MÍNIMO: es el primer pintado,
         ANTES de que cargue el bundle JS, para que nunca haya pantalla
         en blanco durante la descarga. La animación completa vive en
         src/components/SplashScreen.vue (montada desde main.js), que
         reemplaza este contenido al cargar. Si el bundle no carga, este
         fallback queda visible (nunca se oculta sin JS).
         ============================================================ -->
    <style>
      #briku-splash {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #fff;
        z-index: 9999;
      }
      #briku-splash .bg-image {
        position: absolute;
        inset: 0;
        background-image: url("fondo.webp");
        background-size: cover;
        background-position: center;
        transform: scale(1.08);
        filter: blur(10px);
      }
      #briku-splash .bg-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.7);
      }
      /* .stage usa EXACTAMENTE el mismo centrado que SplashScreen.vue:
         centra el contenido en el viewport completo. Así el texto "Briku"
         queda en el mismo punto que el componente animado → sin salto de
         posición al montar. */
      #briku-splash .stage {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
      }
      #briku-splash .brand-text {
        font-size: 72px;
        font-weight: 800;
        color: #173a6a;
        letter-spacing: 4px;
        line-height: 1.1;
        /* Misma fuente que SplashScreen.vue: evita que el "Briku" se corra
           unos píxeles al montar el componente (métricas distintas = flash). */
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="briku-splash">
      <div class="bg-image"></div>
      <div class="bg-overlay"></div>
      <div class="stage">
        <div class="brand-text">Briku</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
